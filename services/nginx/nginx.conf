# Configuración de Nginx como reverse proxy hacia la VulnApp.
# Este fichero se monta en el contenedor Nginx del laboratorio SSRFNest.
# No incluye SSL porque el entorno es un lab local aislado.

worker_processes auto;

# Enviamos los logs a stdout/stderr para que Docker los capture.
error_log /dev/stderr warn;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Tipo MIME por defecto y tipos conocidos.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de log con información útil para el análisis Blue Team:
    # IP real del cliente, cabeceras de forwarding y datos de la petición.
    log_format ssrf_lab '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'real_ip=$http_x_real_ip fwd_for=$http_x_forwarded_for host=$host';

    access_log /dev/stdout ssrf_lab;

    # Tamaño máximo de cuerpo subido (pequeño, es un lab).
    client_max_body_size 1m;

    # Timeouts razonables para no colgar el proxy.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    upstream vulnapp_backend {
        # IP fija de la VulnApp dentro de la red Docker del laboratorio.
        server 172.20.0.5:5000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Cabeceras de forwarding que la app vulnerable usará en sus logs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No cacheamos nada: queremos ver siempre el tráfico real.
        proxy_buffering off;

        location / {
            proxy_pass http://vulnapp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Endpoint de salud propio del proxy (no toca la VulnApp).
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
